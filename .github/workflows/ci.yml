name: CI (PR Gate — Full 14-Job Pipeline in .circleci/config.yml)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  soroban-and-rust-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path stellar/contracts/voting/Cargo.toml
      - run: cargo test --manifest-path backend/Cargo.toml

  django-identity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encryption/biometric
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: encryption/biometric/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test lab -v 2

  fastapi-and-security-verify:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdef0123456789abcdef
      PYTHONPATH: ".:encryption/biometric"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r encryption/biometric/requirements.txt -r services/api/requirements.txt pyyaml
      - run: python scripts/verify_pipeline_and_artifacts.py --strict --emit-artifacts
      - run: python -m pytest services/api/tests/test_api.py tests/test_integration_e2e.py -v
