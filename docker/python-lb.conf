events {}
http {
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
    upstream python_identity_pool {
        least_conn;
        server identity-a:8001 max_fails=3 fail_timeout=10s;
        server identity-b:8001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }
    server {
        listen 8080;
        client_max_body_size 4k;
        location = /health { proxy_pass http://python_identity_pool; }
        location / {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://python_identity_pool;
        }
    }
}
