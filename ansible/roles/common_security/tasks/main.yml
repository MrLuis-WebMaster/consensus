---
- name: Ensure Consensus application directories exist with restricted permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ consensus_app_dir }}"
    - "{{ consensus_app_dir }}/logs"
    - "{{ consensus_app_dir }}/artifacts"

- name: Verify required runtime environment secrets are injected externally (never hardcoded)
  ansible.builtin.assert:
    that:
      - lookup('env', 'DJANGO_SECRET_KEY') | length >= 32
    fail_msg: "DJANGO_SECRET_KEY must be provided via environment or secret manager (>= 32 chars)."
    quiet: true
  when: consensus_env != "dev"
